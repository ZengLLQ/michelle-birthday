  <body>
    <div class="ambient" aria-hidden="true"></div>
    <div class="page-frame" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    <button class="motion-toggle" id="motion-toggle" type="button" aria-label="Pause animation" aria-pressed="false">
      <svg class="pause-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 5v14M15 5v14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      <svg class="play-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m9 5 10 7-10 7V5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
    </button>
    <main class="birthday">
      <section class="message" aria-label="Birthday message for Michelle Adeline Wijaya">
        <div class="little-star" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 30 30" fill="none"><path d="M15 2v26M2 15h26M5.8 5.8l18.4 18.4M24.2 5.8 5.8 24.2" stroke="currentColor" stroke-width="1.5"/></svg></div>
        <h1><span class="headline-line">HAPPY</span> <span class="headline-line">BIRTHDAYYY</span> <span class="headline-line handwritten">BROOO</span></h1>
        <div class="message-body"><span class="message-rule" aria-hidden="true"></span><p>hope everything’s been treating u well over there. wishing u lots of good things this year, take care, n enjoy ur day</p></div>
      </section>
      <div class="artwork">
        <div class="scene-halo" aria-hidden="true"></div>
        <button class="cake-stage" id="cake-stage" type="button" aria-label="Blow out the candle and celebrate">
          <canvas id="birthday-canvas" aria-hidden="true"></canvas>
          <span class="stage-glimmer" aria-hidden="true">✧</span>
        </button>
        <button class="wish-button" id="wish-button" type="button" aria-label="Blow out the candle and celebrate">
          <svg width="23" height="23" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3c0 6-3 9-9 9 6 0 9 3 9 9 0-6 3-9 9-9-6 0-9-3-9-9Z" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/><path d="M20 2v4M18 4h4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
